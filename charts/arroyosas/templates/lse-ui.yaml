{{- if .Values.lseUi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arroyosas.fullname" . }}-lse-ui-nginx
  labels:
    {{- include "arroyosas.labels" . | nindent 4 }}
data:
  # Replaces the image's default.conf, which proxies to a hardcoded lse-api host.
  default.conf: |
    server {
        listen 5173;
        root /usr/share/nginx/html;
        index index.html;

        location /api/v1/ {
            proxy_pass http://{{ include "arroyosas.fullname" . }}-lse-api:{{ .Values.lseApi.service.port }}/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arroyosas.fullname" . }}-lse-ui
  labels:
    {{- include "arroyosas.labels" . | nindent 4 }}
    app.kubernetes.io/component: lse-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arroyosas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lse-ui
  template:
    metadata:
      labels:
        {{- include "arroyosas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lse-ui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lse-ui
          image: "{{ .Values.lseUi.image.repository }}:{{ .Values.lseUi.image.tag }}"
          imagePullPolicy: {{ .Values.lseUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5173
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "arroyosas.fullname" . }}-lse-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arroyosas.fullname" . }}-lse-ui
  labels:
    {{- include "arroyosas.labels" . | nindent 4 }}
    app.kubernetes.io/component: lse-ui
spec:
  type: {{ .Values.lseUi.service.type }}
  selector:
    {{- include "arroyosas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lse-ui
  ports:
    - name: http
      port: {{ .Values.lseUi.service.port }}
      targetPort: http
{{- end }}
