name: Package and publish helm chart

on:
  push:
    branches: ['main']
    paths: ['charts/**', '.github/workflows/publish_chart.yml']
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  CHART_DIR: charts/arroyosas

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }}

      # Tags (v1.2.3) publish chart 1.2.3 with appVersion v1.2.3, matching the
      # image tag from publish_image.yml. Pushes to main publish a prerelease
      # (e.g. 0.1.0-main.42) using the main image, which helm only installs
      # when asked for explicitly.
      - name: Determine chart version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${GITHUB_REF_NAME}"
          else
            BASE=$(helm show chart ${{ env.CHART_DIR }} | awk '/^version:/ {print $2}')
            VERSION="${BASE}-main.${{ github.run_number }}"
            APP_VERSION="main"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package ${{ env.CHART_DIR }} \
            --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.app_version }} \
            --destination dist

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push chart
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm push dist/*.tgz oci://${{ env.REGISTRY }}/${OWNER}/charts
